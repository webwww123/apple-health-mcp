[project]
name = "apple-health-mcp"
version = "0.1.0"
description = "Authenticated Apple Health ingestion API and read-only MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<1.29",
    "pydantic>=2.11,<3",
    "starlette>=0.47,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health_mcp"]
